name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン（semver、例: 0.11.0）'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode.app

jobs:
  release:
    name: Publish
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Read the CodeArtifact settings
        id: codeartifact
        run: sed -n 's/^codeArtifact\.\([a-z]*\)=/\1=/p' gradle.properties >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ steps.codeartifact.outputs.owner }}:role/${{ github.event.repository.name }}-publish
          aws-region: ${{ steps.codeartifact.outputs.region }}

      - name: Identify the committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Release
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./release.sh "$VERSION"

      - name: Create a token for the apps
        id: apps-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.SHARED_CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SHARED_CORE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }},android-app-template,ios-app-template
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull requests in the apps
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.apps-token.outputs.token }}
        run: |
          umask 077
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'machine api.github.com\n  login x-access-token\n  password %s\n' "$GH_TOKEN" > "$HOME/.netrc"
          scripts/open-app-prs.sh "$VERSION"
