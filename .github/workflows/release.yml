name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン（semver、例: 0.11.0）'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode.app

jobs:
  release:
    name: Publish
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read the CodeArtifact settings
        id: codeartifact
        run: sed -n 's/^codeArtifact\.\([a-z]*\)=/\1=/p' gradle.properties >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ steps.codeartifact.outputs.owner }}:role/${{ github.event.repository.name }}-publish
          aws-region: ${{ steps.codeartifact.outputs.region }}

      - name: Identify the committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Release
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./release.sh "$VERSION"
