name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app

jobs:
  verify:
    name: Build and test
    # iOS ターゲットのビルドに Xcode が必要なため macOS ランナーを使う
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      # gradle/gradle-daemon-jvm.properties が Java 25 を要求する。
      # 事前に用意しないと Gradle が foojay から自動ダウンロードして遅くなる。
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify
        run: make verify

      # make verify は共通コアがコンパイルできることまでしか見ていない。
      # publish される AAR は作られず、アプリがそれを使えるかも確認されない。
      # ここで実際に publish し、Android アプリをそれに向けてビルドする。
      # 検証用バージョンはリモートに存在しないため、GitHub Packages の
      # 既存成果物を誤って引くことがない。
      - name: Check out the Android app
        uses: actions/checkout@v7
        with:
          repository: yossibank/android-app-template
          path: consumer-android
          token: ${{ secrets.SHARED_CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Point the Android app at mavenLocal
        run: python3 .github/scripts/point-consumer-at-maven-local.py consumer-android

      - name: Publish the shared library to mavenLocal
        run: ./gradlew :shared:publishToMavenLocal

      - name: Build the Android app against the shared library
        working-directory: consumer-android
        run: ./gradlew assembleDebug testDebugUnitTest

      # iOS も同じ理由で消費側まで見る。XCFramework は作られるが、それを
      # アプリが使えるかは公開後まで分からなかった。SKIE が生成する Swift の
      # API が変わる類の破壊はここでしか捕まらない。
      - name: Check out the iOS app
        uses: actions/checkout@v7
        with:
          repository: yossibank/ios-app-template
          path: consumer-ios
          token: ${{ secrets.SHARED_CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Point the iOS app at the locally built XCFramework
        run: python3 .github/scripts/point-ios-consumer-at-local-xcframework.py consumer-ios

      - name: Build and test the iOS app against the shared library
        working-directory: consumer-ios
        run: |
          xcodebuild test \
            -project ios-app-template.xcodeproj \
            -scheme ios-app-template \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
