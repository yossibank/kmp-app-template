name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app

jobs:
  verify:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      # simctl boot は即座に戻るので、後続のビルド中に裏で起動が進む。
      # iOS のテストはシミュレータの起動待ちが所要時間の大半を占める。
      - name: Start booting the simulator
        run: xcrun simctl boot 'iPhone 17 Pro' || true

      # gradle/gradle-daemon-jvm.properties が Java 25 を要求する。
      # 事前に用意しないと Gradle が foojay から自動ダウンロードして遅くなる。
      # macOS ランナーには Java 25 が入っておらず、setup-java が毎回 200MB 超を
      # ダウンロードして署名検証と展開まで行う（実測 96 秒）。ツールキャッシュごと
      # 持ち越して省く。ubuntu 側は最初から tool-cache にあるため不要。
      - name: Cache the JDK
        uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/Java_Temurin-Hotspot_jdk
          key: jdk-temurin-25-${{ runner.os }}-${{ runner.arch }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify
        run: make verify

      # make verify は共通コアのコンパイルまでしか見ないので、消費側まで確認する。
      - name: Check out the Android app
        uses: actions/checkout@v7
        with:
          repository: yossibank/android-app-template
          path: consumer-android
          token: ${{ secrets.SHARED_CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Point the Android app at mavenLocal
        run: python3 .github/scripts/point-android-at-local-core.py consumer-android

      - name: Publish the shared library to mavenLocal
        run: ./gradlew :shared:publishToMavenLocal

      - name: Build the Android app against the shared library
        working-directory: consumer-android
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Check out the iOS app
        uses: actions/checkout@v7
        with:
          repository: yossibank/ios-app-template
          path: consumer-ios
          token: ${{ secrets.SHARED_CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Point the iOS app at the locally built XCFramework
        run: python3 .github/scripts/point-ios-at-local-core.py consumer-ios

      # generic/platform は x86_64 スライスも要求するため使えない（Apple Silicon のみ対象）。
      - name: Build and test the iOS app against the shared library
        working-directory: consumer-ios
        run: |
          xcodebuild test \
            -project ios-app-template.xcodeproj \
            -scheme ios-app-template \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
