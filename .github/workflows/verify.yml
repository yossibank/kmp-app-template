name: Verify

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode.app

jobs:
  changes:
    name: Detect changes the apps can see
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.diff.outputs.apps }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Compare with the base
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git diff --quiet HEAD^1 HEAD -- \
            shared/api \
            shared/build.gradle.kts \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties \
            gradle/libs.versions.toml \
            Package.swift; then
            echo "apps=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Build and test
    needs: changes
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache the Gradle configuration cache
        uses: actions/cache@v6
        with:
          path: .gradle/configuration-cache
          key: gradle-config-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-config-cache-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify
        run: make verify

      - name: Create a token for the iOS app
        if: needs.changes.outputs.apps == 'true'
        id: ios-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SHARED_CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SHARED_CORE_APP_PRIVATE_KEY }}
          repositories: ios-app-template
          permission-contents: read

      - name: Checkout the iOS app
        if: needs.changes.outputs.apps == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/ios-app-template
          token: ${{ steps.ios-token.outputs.token }}
          path: apps/ios

      - name: Compile the iOS app against this build
        if: needs.changes.outputs.apps == 'true'
        working-directory: apps/ios
        env:
          SHARED_DIR: ${{ github.workspace }}
        run: >-
          xcodebuild build-for-testing
          -workspace AppTemplate.xcworkspace
          -scheme AppTemplate
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          SWIFT_SUPPRESS_WARNINGS=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

  android-app:
    name: Compile the Android app
    needs: changes
    if: needs.changes.outputs.apps == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: kmp

      - name: Create a token for the Android app
        id: android-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SHARED_CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SHARED_CORE_APP_PRIVATE_KEY }}
          repositories: android-app-template
          permission-contents: read

      - name: Checkout the Android app
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/android-app-template
          token: ${{ steps.android-token.outputs.token }}
          path: android

      - name: Check the versions brought into the app
        working-directory: kmp
        run: sh scripts/check-app-versions.sh ../android

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile
        working-directory: android
        env:
          SHARED_DIR: ${{ github.workspace }}/kmp
        run: ./gradlew compileDebugUnitTestKotlin
